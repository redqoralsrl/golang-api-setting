# go tool air -c cmd/api/.air.toml  (저장소 루트에서 실행)
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "data", "docs", "bin", ".git", ".github", ".claude"]
exclude_regex = ['_test\.go$']
delay = 500
stop_on_error = true
# Windows·macOS 에서 볼륨 마운트는 파일 변경 이벤트가 컨테이너로 전달되지 않아 폴링한다
poll = true
poll_interval = 1000

[log]
time = false

[misc]
clean_on_exit = true
