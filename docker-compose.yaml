# 로컬 개발 스택
#   make local-run              API + PostgreSQL
#   make db-up                  PostgreSQL 만 (API 는 로컬에서 make dev)
#   docker compose --profile cache up -d cache_db   Redis 도 필요할 때
name: ${COMPOSE_PROJECT_NAME:-go-template}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: cache_db
      API_PORT: "8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # PostgreSQL 18 부터 데이터 경로가 /var/lib/postgresql/<버전> 이라 상위를 마운트한다
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  cache_db:
    image: redis:8.2-alpine
    profiles: [cache]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-redis-password}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
