syntax = "proto3";

package user.v1;

option go_package = "go-template/internal/grpc/pb/user/v1;userv1";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
}

message CreateUserResponse {
  int64 id = 1;
  string email = 2;
  string access_token = 3;
}